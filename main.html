<div class="triptych">

    <!-- ===== ЛЕВАЯ БОКОВАЯ ИКОНА ===== -->

    <!-- ===== ЦЕНТРАЛЬНАЯ ЧАСТЬ ===== -->
    <div class="center">

        <!-- ГЛАВНАЯ ИКОНА -->
        <div class="main-icon-header">
            <!-- ВСТАВЬ СЮДА BASE64 КВАДРАТНОЙ ИКОНЫ -->
            <img src="photo_2026-04-07_02-02-41.jpg" alt="Преподователь-Линал" class="main-icon">
            <div class="main-icon-title">Святой Марвин</div>
            <div class="main-icon-subtitle">Преподователь-Линал</div>
        </div>

        <div class="vine-divider">· · · ✦ · · ·</div>

        <!-- ПРИЛОЖЕНИЕ -->

            <div class="header">
                <h1>Личный Темп Подготовки</h1>
                <div class="countdown" id="timer">Загрузка...</div>
            </div>

            <div class="pace-box" id="pace-info">
                Анализируем твою скорость...
            </div>

            <div class="stats-bar">
                <span>📅 Сегодня: <span id="today-date"></span></span>
                <span>🔥 Повторить: <span id="count-ready">0</span></span>
            </div>

            <div id="list"></div>

            <div class="ornament-divider">· · · ☦ · · ·</div>

    <!-- ===== ПРАВАЯ БОКОВАЯ ИКОНА ===== -->
    <div class="side-panel right">
        <!-- ВСТАВЬ СЮДА BASE64 ВЫСОКОЙ ИКОНЫ -->
        <img src="photo_2026-04-07_01-52-41.jpg" alt="Святой Марвин" class="side-img">
        <span class="side-label">☦ Святой Марвин ☦</span>
    </div>

</div>

<script>
    const examDate = new Date(2026, 5, 1); 
    const ticketsData = [
        { t: "Аксиомы скалярного произведения и следствия. Коши-Буняковский", c: "<b>Суть:</b> Линейность, симметрия, положительность. |(x,y)| ≤ ||x||·||y||." },
        { t: "ЛНЗ ортогональной системы векторов. Процесс Грама-Шмидта", c: "<b>Суть:</b> Ортогональность ⇒ ЛНЗ. Алгоритм построения ОНБ." },
        { t: "Свойства ОНБ. Теорема об определителе Грама", c: "<b>Суть:</b> Координаты векторов. det(G)=0  система зависима." },
        { t: "Теорема об ортогональных дополнениях", c: "<b>Суть:</b> V = L ⊕ Lᐩ. Каждый вектор имеет единственную проекцию." },
        { t: "Критерии линейности. Линейность суммы и произведения ЛО", c: "<b>Суть:</b> Аддитивность и однородность. Операции над ЛО не выводят из класса линейных." },
        { t: "Координаты образа и прообраза. Матрицы ЛО в разных базисах", c: "<b>Суть:</b> Y = AX. Смена базиса: A' = C⁻¹AC." },
        { t: "Ядро и область значений. Теорема о ранге и дефекте", c: "<b>Суть:</b> dim(V) = rank(A) + defect(A)." },
        { t: "Инвариантность хар. многочлена. Собственные значения", c: "<b>Суть:</b> det(A-λE) не зависит от базиса. Корни - это СЗ." },
        { t: "Определитель полураспавшейся матрицы. ЛНЗ собственных векторов", c: "<b>Суть:</b> Разные СЗ ⇒ ЛНЗ векторы." },
        { t: "Свойства самосопряжённых линейных операторов", c: "<b>Суть:</b> Вещественные СЗ, ортогональные СВ. Матрица симметрична." },
        { t: "Теорема Коши для ДУ-I (существование и единственность)", c: "<b>Суть:</b> Непрерывность + условие Липшица." },
        { t: "Задача Коши для ЛДУ. Принцип суперпозиции", c: "<b>Суть:</b> Общее решение = ФСР + частное." },
        { t: "Теорема о вронскиане линейно зависимых функций", c: "<b>Суть:</b> Функции ЛЗ ⇒ W(x) ≡ 0 на интервале." }
    ];

    const intervals = [1, 3, 7, 14, 30]; 
    let state = JSON.parse(localStorage.getItem('exam_manager_v7')) || 
                ticketsData.map(item => ({ name: item.t, cheat: item.c, step: 0, nextReview: null }));

    function updatePace() {
        const now = new Date();
        const diff = examDate - now;
        const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
        const notStarted = state.filter(s => s.step === 0).length;

        let paceText = "";
        if (notStarted > 0) {
            const daysPerTicket = (daysLeft / notStarted).toFixed(1);
            paceText = `Тебе нужно учить <b>1 новый билет раз в ${daysPerTicket} дн.</b>, чтобы успеть к 1 июня.`;
            if (daysPerTicket < 1) paceText = `️ <b>Внимание!</b> Нужно учить по <b>${Math.ceil(1/daysPerTicket)} билета в день</b>, ты не успеваешь!`;
        } else {
            paceText = "✅ Все билеты изучены! Теперь только повторяй то, что загорается зеленым.";
        }
        document.getElementById('pace-info').innerHTML = paceText;
        
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById('timer').innerText = `До экзамена: ${daysLeft}д. ${hours}ч.`;
    }

    function render() {
        const listEl = document.getElementById('list');
        const now = new Date(); now.setHours(0,0,0,0);
        document.getElementById('today-date').innerText = now.toLocaleDateString('ru-RU');
        listEl.innerHTML = '';
        let readyCount = 0;

        state.forEach((item, i) => {
            const nextDate = item.nextReview ? new Date(item.nextReview) : null;
            const isReady = !nextDate || nextDate <= now;
            if (isReady) readyCount++;

            const card = document.createElement('div');
            card.className = `ticket-card ${isReady ? 'ready' : 'waiting'}`;
            card.onclick = () => {
                const s = card.querySelector('.cheat-sheet');
                s.style.display = s.style.display === 'block' ? 'none' : 'block';
            };
            
            let status = nextDate ? `След. повтор: ${nextDate.toLocaleDateString('ru-RU')}` : "🆕 Ещё не открывал";
            if (item.step >= intervals.length) status = "⭐ В долговременной памяти";

            card.innerHTML = `
                <button class="btn-action" ${!isReady ? 'disabled' : ''} onclick="event.stopPropagation(); review(${i})">
                    ${item.step === 0 ? 'Изучить' : 'Повторил'}
                </button>
                <span class="ticket-title">${i+1}. ${item.name}</span>
                <div class="info-row">Шаг: ${item.step}/5 | ${status}</div>
                <div class="cheat-sheet">${item.cheat}</div>
            `;
            listEl.appendChild(card);
        });
        document.getElementById('count-ready').innerText = readyCount;
        localStorage.setItem('exam_manager_v7', JSON.stringify(state));
        updatePace();
    }

    window.review = (id) => {
        const now = new Date(); now.setHours(0,0,0,0);
        const next = new Date(now);
        next.setDate(now.getDate() + (intervals[state[id].step] || 30));
        state[id].step++;
        state[id].nextReview = next.getTime();
        render();
    };

    window.resetAll = () => {
        if(confirm("Сбросить?")) { localStorage.removeItem('exam_manager_v7'); location.reload(); }
    };

    render();
    setInterval(updatePace, 60000);
</script>

</body>
</html>
